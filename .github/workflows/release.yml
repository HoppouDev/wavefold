name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          stage="wavefold-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/release/wavefold "$stage/"
          cp -r packaging/linux "$stage/"
          mkdir -p "$stage/linux/icons/hicolor/scalable/apps"
          cp docs/icon.svg "$stage/linux/icons/hicolor/scalable/apps/wavefold.svg"
          cp LICENSE.md README.md "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: softprops/action-gh-release@v2
        with:
          files: wavefold-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz

  windows-x64:
    needs: version
    runs-on: windows-latest
    env:
      arch: x64
      target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.target }}

      # No GStreamer install/bundling needed here (unlike the linux job) -
      # the Windows build uses backends/media_foundation.rs, built on
      # Media Foundation, which ships with the OS itself.
      - run: cargo build --release --target ${{ env.target }}

      - name: Package
        shell: pwsh
        run: |
          $stage = "wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target\${{ env.target }}\release\wavefold.exe" $stage\
          Copy-Item LICENSE.md,README.md $stage\
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.arch }}-exe
          path: wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}
          retention-days: 1

      - uses: softprops/action-gh-release@v2
        with:
          files: wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}.zip

  windows-arm64:
    needs: version
    runs-on: windows-11-arm
    env:
      arch: arm64
      target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.target }}

      - run: cargo build --release --target ${{ env.target }}

      - name: Package
        shell: pwsh
        run: |
          $stage = "wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target\${{ env.target }}\release\wavefold.exe" $stage\
          Copy-Item LICENSE.md,README.md $stage\
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.arch }}-exe
          path: wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}
          retention-days: 1

      - uses: softprops/action-gh-release@v2
        with:
          files: wavefold-${{ needs.version.outputs.version }}-${{ env.arch }}.zip

  windows-installer-x64:
    needs: [version, windows-x64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-exe
          path: packaging/windows/dist/x64

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Build installer
        working-directory: packaging/windows
        run: >
          iscc
          /DAppVersion=${{ needs.version.outputs.version }}
          /DArch=x64
          /DSourceDir=dist\x64
          installer.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/wavefold-${{ needs.version.outputs.version }}-x64-setup.exe

  windows-installer-arm64:
    needs: [version, windows-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-arm64-exe
          path: packaging/windows/dist/arm64

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Build installer
        working-directory: packaging/windows
        run: >
          iscc
          /DAppVersion=${{ needs.version.outputs.version }}
          /DArch=arm64
          /DSourceDir=dist\arm64
          installer.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/wavefold-${{ needs.version.outputs.version }}-arm64-setup.exe
