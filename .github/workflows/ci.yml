name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Standard GitHub-hosted runners have no GPU/wgpu adapter and no VAAPI
    # device — this job is the proof the CLI's --backend cpu path works
    # without either. No container workaround needed here (unlike the old
    # ffmpeg-next-based pipeline): GStreamer's C ABI has been stable since
    # 1.0, so plain Ubuntu-packaged GStreamer just works — see CLAUDE.md's
    # "What this is" section for why that's specifically what changed.
    steps:
      - name: Install GStreamer dev headers, plugins, and ffmpeg (test fixtures only)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-vaapi \
            pkg-config ffmpeg

      - uses: actions/checkout@v4

      - name: Build (single wavefold binary — gui/encode subcommands)
        run: cargo build --release

      - name: Run library/unit tests (CPU-backend tests need no GPU)
        run: cargo test --release --lib

      - name: Generate a short synthetic test clip
        run: |
          ffmpeg -v error -f lavfi -i testsrc=size=160x120:duration=1:rate=8 \
            -pix_fmt yuv420p -y sample.mp4

      - name: Encode headlessly (CPU DCT backend, software encoder)
        run: |
          cargo run --release -- encode \
            sample.mp4 out.mp4 --backend cpu --encoder h264

      - name: Verify output was produced
        run: test -s out.mp4
