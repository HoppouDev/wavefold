name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cross.toml"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cross.toml"
      - ".cargo/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Standard GitHub-hosted runners have no GPU/wgpu adapter and no VAAPI
    # device — this job is the proof the CLI's --backend cpu path works
    # without either. No container workaround needed here (unlike the old
    # ffmpeg-next-based pipeline): GStreamer's C ABI has been stable since
    # 1.0, so plain Ubuntu-packaged GStreamer just works — see CLAUDE.md's
    # "What this is" section for why that's specifically what changed.
    # `wild` (.cargo/config.toml's linker for this target) is a dev-machine
    # speed optimization only, not installed here — the env vars below
    # override the linker back to plain `cc` with no extra rustflags for
    # this job, so CI never needs to build/install wild at all.
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - name: Install GStreamer dev headers, plugins, and ffmpeg (test fixtures only)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-vaapi \
            pkg-config ffmpeg

      - uses: actions/checkout@v4

      # .cargo/config.toml's `build.rustc-wrapper = "sccache"` applies
      # unconditionally - without sccache installed here, the very first
      # `cargo build` below fails immediately (`could not execute process
      # 'sccache ...'`). (The same file's `wild` linker for this target is
      # overridden back to `cc` above - dev-machine-only, see this job's env.)
      # `SCCACHE_GHA_ENABLED` (job-level, so every cargo step below benefits,
      # not just the build one) points sccache at the GitHub Actions cache
      # backend instead of an ephemeral runner's local disk, which would
      # otherwise never persist anything across runs.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build (single wavefold binary — gui/encode subcommands)
        run: cargo build --release

      - name: Run library/unit tests (CPU-backend tests need no GPU)
        run: cargo test --release --lib

      - name: Generate a short synthetic test clip
        run: |
          ffmpeg -v error -f lavfi -i testsrc=size=160x120:duration=1:rate=8 \
            -pix_fmt yuv420p -y sample.mp4

      - name: Encode headlessly (CPU DCT backend, software encoder)
        run: |
          cargo run --release -- encode \
            sample.mp4 out.mp4 --backend cpu --encoder h264

      - name: Verify output was produced
        run: test -s out.mp4
