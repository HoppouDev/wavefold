[package]
name = "wavefold"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio"] }
wgpu = "30"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "1"
anyhow = "1"
rfd = "0.17"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Media I/O backend: GStreamer everywhere except Windows (no system package
# manager there to provide it - see backends/media_foundation.rs), Media
# Foundation (part of the OS, no extra runtime needed) on Windows.
[target.'cfg(not(windows))'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_MediaFoundation",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3"

# Ground-truth oracle for testing the hand-written GPU mixed-radix FFT
# (src/shader_fft.wgsl) — never shipped, no runtime dependency on it.
[dev-dependencies]
rustfft = "6"

[profile.release]
opt-level = 3
strip = true
