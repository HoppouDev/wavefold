[package]
name = "wavefold"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio"] }
wgpu = "30"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "1"
anyhow = "1"
rfd = "0.17"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# GUI test-automation IPC server (src/ui/automation.rs) - a localhost TCP
# JSON-line protocol that injects real `ui::Message`s and reads back state,
# so tests/AI agents can drive the app deterministically instead of OS-level
# screenshot+input-injection (which is platform-specific, fragile against
# window-manager focus/DPI quirks, and was the whole reason this exists -
# see the git history around this feature). Off by default: it's a
# localhost command port that can inject arbitrary UI actions, not
# something a normal release build should carry.
[features]
# tokio's net/io-util/time are only used by src/ui/automation.rs - gated
# here rather than on the base `tokio` dependency line so a default build
# doesn't link networking/IO-driver machinery it never uses, matching the
# "off by default" intent above.
automation = ["dep:serde", "dep:serde_json", "tokio/net", "tokio/io-util", "tokio/time"]

# Media I/O backend: GStreamer everywhere except Windows (no system package
# manager there to provide it - see backends/media_foundation.rs), Media
# Foundation (part of the OS, no extra runtime needed) on Windows.
[target.'cfg(not(windows))'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_MediaFoundation",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "3"

# Ground-truth oracle for testing the hand-written GPU mixed-radix FFT
# (src/shader_fft.wgsl) — never shipped, no runtime dependency on it.
[dev-dependencies]
rustfft = "6"

[profile.release]
opt-level = 3
strip = true
