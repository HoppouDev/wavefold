[package]
name = "wavefold"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio"] }
wgpu = "30"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "1"
anyhow = "1"
rfd = "0.17"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
